[package]
name = "ona-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "ona_core"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
local-ip-address = "0.6"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
futures = "0.3"