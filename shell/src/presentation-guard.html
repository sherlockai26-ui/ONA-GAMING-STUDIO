<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ONA Presentation Guard</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #02050a;
            color: #eaf6ff;
            font-family: Arial, Helvetica, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            display: grid;
            place-items: center;
            animation: guardFadeIn 150ms ease-out both;
        }

        .guard {
            display: grid;
            gap: 18px;
            justify-items: center;
            position: relative;
            min-width: min(520px, 72vw);
        }

        .guard::before {
            content: "";
            position: absolute;
            inset: -32px -48px;
            border: 1px solid rgba(110, 220, 255, 0.18);
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(110, 220, 255, 0.16),
                    transparent
                );
            filter: blur(0.2px);
            transform: skewX(-18deg) translateX(-45%);
            animation: guardSweep 1200ms ease-in-out infinite;
            pointer-events: none;
        }

        .logo {
            font-size: clamp(28px, 7vw, 78px);
            font-weight: 300;
            letter-spacing: 8px;
            text-shadow:
                0 0 18px rgba(120, 220, 255, 0.35),
                0 0 42px rgba(20, 120, 255, 0.18);
            animation: guardPulse 1400ms ease-in-out infinite;
        }

        .status {
            font-size: clamp(10px, 1.6vw, 16px);
            letter-spacing: 2px;
            color: rgba(220, 240, 255, 0.72);
        }

        .rail {
            width: min(320px, 54vw);
            height: 2px;
            overflow: hidden;
            background: rgba(140, 220, 255, 0.14);
        }

        .rail::after {
            content: "";
            display: block;
            width: 38%;
            height: 100%;
            background: rgba(180, 245, 255, 0.86);
            box-shadow: 0 0 18px rgba(120, 220, 255, 0.65);
            animation: guardRail 900ms ease-in-out infinite;
        }

        @keyframes guardFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes guardPulse {
            0%,
            100% {
                opacity: 0.82;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes guardSweep {
            0% {
                transform: skewX(-18deg) translateX(-55%);
                opacity: 0;
            }

            30%,
            70% {
                opacity: 1;
            }

            100% {
                transform: skewX(-18deg) translateX(55%);
                opacity: 0;
            }
        }

        @keyframes guardRail {
            0% {
                transform: translateX(-120%);
            }

            100% {
                transform: translateX(320%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body,
            .guard::before,
            .logo,
            .rail::after {
                animation-duration: 1ms;
                animation-iteration-count: 1;
            }
        }
    </style>
</head>

<body>
    <main class="guard" aria-hidden="true">
        <div class="logo">ON/A</div>
        <div class="rail"></div>
        <div id="status" class="status">RESTORING CONSOLE PRESENTATION</div>
    </main>
    <script>
        const labels = {
            LAUNCHING_GAME: "LAUNCHING",
            RETURNING_TO_ONA: "RETURNING TO ONA",
            SWITCHING_GAME: "SWITCHING GAME",
            RESUMING_GAME: "RESUMING GAME"
        };

        const setGuardMode = (mode) => {
            const normalized = String(mode || "RETURNING_TO_ONA").toUpperCase();
            document.body.dataset.guardMode = normalized;
            document.getElementById("status").textContent =
                labels[normalized] || "RESTORING CONSOLE PRESENTATION";
        };

        if (window.__TAURI__?.event?.listen) {
            window.__TAURI__.event.listen("ona-guard-mode", (event) => {
                setGuardMode(event.payload);
            });
        }

        setGuardMode("RETURNING_TO_ONA");
    </script>
</body>

</html>
