<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 minimum-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#02050a"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <link
        rel="manifest"
        href="../manifest.json"
    >

    <title>ONA Controller</title>

    <link
        rel="stylesheet"
        href="style.css?v=mobile-v4"
    >

</head>


<body>

    <main id="controller">


        <!-- =========================================
             PARTE SUPERIOR
             ========================================= -->

        <header class="top-bar">


            <button
                type="button"
                class="shoulder l1"
            >
                L1
            </button>


            <button
                type="button"
                class="shoulder l2"
            >
                L2
            </button>


            <div class="ona-logo">
                ON<span>/</span>A
            </div>

            <div
                id="connection-status"
                class="connection-status"
            >
                CONNECTING
            </div>

            <button
                type="button"
                id="customize-toggle"
                class="customize-toggle"
                aria-label="Customize controller layout"
            >
                EDIT
            </button>


            <div class="system-buttons">

                <button
                    type="button"
                    class="system-button"
                >
                    SELECT
                </button>

                <button
                    type="button"
                    class="system-button"
                >
                    START
                </button>

            </div>


            <button
                type="button"
                class="shoulder r1"
            >
                R1
            </button>


            <button
                type="button"
                class="shoulder r2"
            >
                R2
            </button>


        </header>


        <!-- =========================================
             JOYSTICK
             ========================================= -->

        <section class="left-control">

            <div id="joystick-zone">

                <div id="joystick">

                    <div class="joystick-core"></div>

                </div>

            </div>

        </section>


        <!-- =========================================
             BOTONES A B X Y
             ========================================= -->

        <section class="right-control">


            <button
                type="button"
                class="action-button button-y"
                data-button="Y"
            >
                Y
            </button>


            <button
                type="button"
                class="action-button button-x"
                data-button="X"
            >
                X
            </button>


            <button
                type="button"
                class="action-button button-b"
                data-button="B"
            >
                B
            </button>


            <button
                type="button"
                class="action-button button-a"
                data-button="A"
            >
                A
            </button>


        </section>


        <section
            id="customize-panel"
            class="customize-panel"
            hidden
        >
            <button type="button" data-customize-action="done">DONE</button>
            <button type="button" data-customize-action="cancel">CANCEL</button>
            <button type="button" data-customize-action="preset-default">DEFAULT</button>
            <button type="button" data-customize-action="preset-compact">COMPACT</button>
            <button type="button" data-customize-action="preset-large">LARGE</button>
            <button type="button" data-customize-action="preset-left">LEFT</button>
            <button type="button" data-customize-action="size-down">- SIZE</button>
            <button type="button" data-customize-action="size-up">+ SIZE</button>
            <button type="button" data-customize-action="palette-blue">BLUE</button>
            <button type="button" data-customize-action="palette-red">RED</button>
            <button type="button" data-customize-action="reset">RESET</button>
        </section>


    </main>


    <script src="controller.js?v=mobile-v4"></script>

</body>

</html>
