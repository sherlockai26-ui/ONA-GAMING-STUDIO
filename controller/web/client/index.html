<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 minimum-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#02050a"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <link
        rel="manifest"
        href="../manifest.json"
    >

    <title>ONA Controller</title>

    <link
        rel="stylesheet"
        href="style.css?v=controller-ui-2026-08-16-demo-stabilization-v8"
    >

</head>


<body class="controller-booting">

    <main id="controller">


        <!-- =========================================
             PARTE SUPERIOR
             ========================================= -->

        <header class="top-bar">


            <button
                type="button"
                class="shoulder l1"
            >
                L1
            </button>


            <button
                type="button"
                class="shoulder l2"
            >
                L2
            </button>


            <div class="ona-logo">
                ON<span>/</span>A
            </div>

            <div
                id="connection-status"
                class="connection-status"
            >
                CONNECTING
            </div>

            <button
                type="button"
                id="customize-toggle"
                class="customize-toggle"
                aria-label="Customize controller layout"
            >
                EDIT
            </button>


            <div class="system-buttons">

                <button
                    type="button"
                    id="select-button"
                    class="system-button"
                >
                    SELECT
                </button>

                <button
                    type="button"
                    id="start-button"
                    class="system-button"
                >
                    START
                </button>

            </div>


            <button
                type="button"
                class="shoulder r1"
            >
                R1
            </button>


            <button
                type="button"
                class="shoulder r2"
            >
                R2
            </button>


        </header>


        <!-- =========================================
             JOYSTICK
             ========================================= -->

        <section class="left-control">

            <div id="joystick-zone">

                <div id="joystick">

                    <div class="joystick-core"></div>

                </div>

            </div>

        </section>


        <!-- =========================================
             BOTONES A B X Y
             ========================================= -->

        <section class="right-control">


            <button
                type="button"
                class="action-button button-y"
                data-button="Y"
            >
                Y
            </button>


            <button
                type="button"
                class="action-button button-x"
                data-button="X"
            >
                X
            </button>


            <button
                type="button"
                class="action-button button-b"
                data-button="B"
            >
                B
            </button>


            <button
                type="button"
                class="action-button button-a"
                data-button="A"
            >
                A
            </button>


        </section>


        <section
            id="customize-panel"
            class="customize-panel"
            hidden
        >

            <div class="customize-panel-header">
                <strong id="customize-title">CUSTOMIZE CONTROLLER</strong>
                <span id="selected-control-label"></span>
                <span id="selected-control-size"></span>
            </div>

            <div
                id="customize-actions"
                class="customize-actions"
            ></div>

            <input
                id="control-size-slider"
                class="control-size-slider"
                type="range"
                min="0.7"
                max="1.4"
                step="0.01"
                value="1"
                hidden
            >

        </section>

        <section
            id="controller-diagnostics"
            class="controller-diagnostics"
            aria-live="polite"
        ></section>

    </main>


    <script src="controller.js?v=controller-ui-2026-08-16-demo-stabilization-v8"></script>

</body>

</html>
